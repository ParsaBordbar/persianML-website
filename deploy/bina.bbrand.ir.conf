# nginx site config for bina.bbrand.ir
# Serves the built Vite app from /var/www/bina.bbrand.ir
#
# Install:
#   sudo cp deploy/bina.bbrand.ir.conf /etc/nginx/sites-available/bina.bbrand.ir
#   sudo ln -s /etc/nginx/sites-available/bina.bbrand.ir /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name bina.bbrand.ir;

    # ACME challenge for certbot webroot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # alternate HTTPS port
    listen 1414 ssl http2;
    listen [::]:1414 ssl http2;
    server_name bina.bbrand.ir;

    root /var/www/bina.bbrand.ir;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/bina.bbrand.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bina.bbrand.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # hashed build assets — cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # fonts are stable files — cache long
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
